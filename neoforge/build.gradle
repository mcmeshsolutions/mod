plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.266'
    runs {
        client { client() }
        server {
            server()
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('mcmeshRunDir').getOrElse('run'))
        }
    }
    mods {
        mcmesh {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
            sourceSet project(':api').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':api')
    jarJar(project(':api'))
    implementation project(':core')
    jarJar(project(':core'))
}

tasks.register('importWorld', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.ImportTool'
    jvmArgs '-Xmx3g'
}

tasks.register('exportWorld', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.ExportTool'
    jvmArgs '-Xmx3g'
}
