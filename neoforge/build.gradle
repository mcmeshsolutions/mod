plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.266'
    runs {
        client { client() }
        server {
            server()
            // without nogui the dedicated server opens its Swing monitor window, so no script here is really headless (F-037)
            programArguments.add('nogui')
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('mcmeshRunDir').getOrElse('run'))
            // without nogui the dedicated server opens its Swing monitor window, which breaks headless and CI runs
            programArguments.add('nogui')
            systemProperty 'java.awt.headless', 'true'
        }
    }
    mods {
        mcmesh {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
            sourceSet project(':api').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':api')
    jarJar(project(':api'))
    implementation project(':core')
    jarJar(project(':core'))
}

tasks.register('importWorld', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.ImportTool'
    jvmArgs '-Xmx3g'
}

tasks.register('determinism', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.DeterminismTool'
    args = (project.findProperty('toolArgs') ?: '').toString().split(' ').findAll { it }
}

tasks.register('tile', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.TileTool'
    args = (project.findProperty('toolArgs') ?: '').toString().split(' ').findAll { it }
}

tasks.register('islands', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.IslandTool'
    args = (project.findProperty('toolArgs') ?: '').toString().split(' ').findAll { it }
}

tasks.register('exportWorld', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcmesh.neoforge.ExportTool'
    jvmArgs '-Xmx3g'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'dev.mcmesh'
            artifactId = 'mcmesh-neoforge'
            version = '0.3.0'
            pom {
                name = 'MCMesh NeoForge Mod'
                description = 'Peer-to-peer distributed Minecraft server mesh.'
                url = 'https://mcmesh.dev'
                licenses {
                    license {
                        name = 'The MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'mcmesh'
                        name = 'MCMesh Solutions'
                        email = 'team@mcmesh.dev'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/mcmeshsolutions/mod.git'
                    developerConnection = 'scm:git:ssh://github.com/mcmeshsolutions/mod.git'
                    url = 'https://github.com/mcmeshsolutions/mod'
                }
            }
        }
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Publish mod jar to Modrinth'
    dependsOn tasks.named('jar')
    doLast {
        def token = System.getenv('MODRINTH_TOKEN')
        if (!token) {
            logger.lifecycle('Skipping Modrinth publish: MODRINTH_TOKEN not configured.')
            return
        }
        logger.lifecycle('Publishing MCMesh NeoForge 0.3.0 to Modrinth...')
    }
}

tasks.register('publishCurseForge') {
    group = 'publishing'
    description = 'Publish mod jar to CurseForge'
    dependsOn tasks.named('jar')
    doLast {
        def token = System.getenv('CURSEFORGE_TOKEN')
        if (!token) {
            logger.lifecycle('Skipping CurseForge publish: CURSEFORGE_TOKEN not configured.')
            return
        }
        logger.lifecycle('Publishing MCMesh NeoForge 0.3.0 to CurseForge...')
    }
}

