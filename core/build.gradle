plugins { id 'java-library' }

repositories { mavenCentral() }

java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile) { options.release = 17 }
// tests run on the build JDK and may use newer library calls
tasks.named("compileTestJava") { options.release = 21 }

dependencies {
    // Minecraft ships gson, so the mod only needs it at compile time
    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'gatewayd.bin', System.getenv('MCMESH_GATEWAYD') ?: "${rootDir}/../target/debug/gatewayd"
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}

// gradle :core:packBuilder -PpackArgs="keygen author.key"   or   -PpackArgs="build <packDir> <packId> <version> <keyfile> <outDir> [<previous manifest.json>]"
tasks.register('packBuilder', JavaExec) {
    classpath = sourceSets.main.output + configurations.compileClasspath
    mainClass = 'dev.mcmesh.core.PackBuilder'
    args = (project.findProperty('packArgs') ?: '').toString().split(' ').findAll { it }
}

// Standalone, cross-platform pre-launch updater (PrismLauncher "pre-launch command"): completely separate from
// the modpack itself, so it can update mods/config and tune JVM memory before NeoForge even starts. Pure JDK
// plus a bundled Gson (Minecraft normally supplies Gson, but nothing here runs inside Minecraft's classpath).
tasks.register('standaloneUpdaterJar', Jar) {
    archiveBaseName = 'mcmesh-updater'
    archiveVersion = ''
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('updater')
    manifest { attributes 'Main-Class': 'dev.mcmesh.core.PackPreLaunch' }
    from(sourceSets.main.output)
    from({ configurations.compileClasspath.filter { it.name.contains('gson') }.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
